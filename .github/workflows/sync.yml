name: GitHub ↔ Google Docs Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force full synchronization ignoring SHA cache'
        required: false
        default: false
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache dependencies and State
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            last_commit_sha_*.txt
            config.yaml
          key: sync-sha-${{ github.run_id }}
          restore-keys: |
            sync-sha-

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Create Credentials JSON
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          echo "$GCP_CREDENTIALS" > credentials.json

      - name: Run Sync Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json
        run: |
          PYTHONPATH="." python src/main.py ${{ github.event.inputs.force == true && '--force' || '' }}

      - name: Alert on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Docs Sync Failed (Failsafe or Error)',
              body: 'The GitHub ↔ Google Docs Sync workflow failed. This could be due to a failsafe trigger, API error, or config auto-healing failure.\n\nPlease check the [workflow run](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ') for details.'
            })
